<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mariogotchi</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <!-- ===== PANTALLA DE ADOPCIÓN ===== -->
  <div id="pantalla-adopcion" class="consola">
    <div class="consola__pantalla">
      <h1 class="titulo-retro">MARIOGOTCHI</h1>
      <p class="subtitulo-retro">&#x2605; It's-a me! &#x2605;</p>

      <form id="formulario-adopcion" class="formulario" novalidate>
        <div class="formulario__campo">
          <label for="input-nombre" class="formulario__etiqueta">Nombre:</label>
          <input
            type="text"
            id="input-nombre"
            class="formulario__input"
            placeholder="Ej: Mario"
            maxlength="12"
            autocomplete="off"
          />
          <span id="error-nombre" class="formulario__error" aria-live="polite"></span>
        </div>

        <div class="formulario__campo">
          <label class="formulario__etiqueta">Elige tu personaje:</label>
          <div class="selector-personaje" id="selector-personaje">
            <button type="button" class="personaje-opcion seleccionado" data-tipo="mario">
              <img src="assets/mario/normal.svg" alt="Mario" class="personaje-opcion__img" />
              <span>Mario</span>
            </button>
            <button type="button" class="personaje-opcion" data-tipo="luigi">
              <img src="assets/luigi/normal.svg" alt="Luigi" class="personaje-opcion__img" />
              <span>Luigi</span>
            </button>
            <button type="button" class="personaje-opcion" data-tipo="yoshi">
              <img src="assets/yoshi/normal.svg" alt="Yoshi" class="personaje-opcion__img" />
              <span>Yoshi</span>
            </button>
          </div>
        </div>

        <button type="submit" class="boton boton--principal" id="boton-adoptar">
          &#x25BA; START GAME!
        </button>
      </form>
    </div>
    <div class="consola__cuerpo"></div>
  </div>

  <!-- ===== PANTALLA PRINCIPAL ===== -->
  <div id="pantalla-principal" class="consola oculto">
    <div class="consola__pantalla">
      <div class="cabecera-mascota">
        <span class="hud-monedas">&#x2605;<span id="contador-monedas">00</span></span>
        <span id="nombre-mascota" class="nombre-retro">???</span>
        <span class="hud-vidas">&#x2665;&#x2665;&#x2665;</span>
      </div>

      <div class="zona-mascota">
        <img id="imagen-mascota" src="" alt="Mascota" class="mascota-img" />
      </div>

      <div class="barras-estado">
        <div class="barra-estado">
          <span class="barra-estado__icono" title="Hambre">&#x1F344;</span>
          <progress id="barra-hambre" class="barra-estado__progreso" max="100" value="80"></progress>
          <span id="texto-hambre" class="barra-estado__numero">80%</span>
        </div>
        <div class="barra-estado">
          <span class="barra-estado__icono" title="Energía">&#x2B50;</span>
          <progress id="barra-energia" class="barra-estado__progreso" max="100" value="80"></progress>
          <span id="texto-energia" class="barra-estado__numero">80%</span>
        </div>
        <div class="barra-estado">
          <span class="barra-estado__icono" title="Felicidad">&#x1F60A;</span>
          <progress id="barra-felicidad" class="barra-estado__progreso" max="100" value="80"></progress>
          <span id="texto-felicidad" class="barra-estado__numero">80%</span>
        </div>
      </div>
    </div>

    <div class="consola__botones">
      <button id="boton-alimentar" class="boton boton--accion">&#x1F344; Comer</button>
      <button id="boton-jugar"     class="boton boton--accion">&#x1F3AE; Jugar</button>
      <button id="boton-dormir"   class="boton boton--accion">&#x1F4A4; Dormir</button>
    </div>
  </div>

  <!-- ===== PANTALLA GAME OVER ===== -->
  <div id="pantalla-game-over" class="consola oculto">
    <div class="consola__pantalla consola__pantalla--game-over">
      <h2 class="titulo-retro titulo-retro--rojo">GAME OVER</h2>
      <p class="subtitulo-retro">&#x2665; x 0 &nbsp;&#x2014;&nbsp; Insert coin...</p>
      <div class="zona-mascota">
        <img id="imagen-game-over" src="" alt="Mascota K.O." class="mascota-img mascota-img--muerta" />
      </div>
      <button id="boton-reiniciar" class="boton boton--principal">&#x25BA; CONTINUE?</button>
    </div>
    <div class="consola__cuerpo"></div>
  </div>

  <!-- ===== MODAL MINIJUEGO PPT ===== -->
  <div id="modal-minijuego" class="modal oculto">
    <div class="modal__contenido">
      <h3 class="titulo-retro titulo-retro--pequeno">MINIJUEGO</h3>
      <p class="subtitulo-retro">&#x1FAA8; Piedra · Papel · Tijeras &#x2702;&#xFE0F;</p>

      <div id="zona-eleccion" class="ppt-eleccion">
        <button class="boton-ppt" data-opcion="piedra">&#x1FAA8;<span>Piedra</span></button>
        <button class="boton-ppt" data-opcion="papel">&#x1F4C4;<span>Papel</span></button>
        <button class="boton-ppt" data-opcion="tijeras">&#x2702;&#xFE0F;<span>Tijeras</span></button>
      </div>

      <div id="zona-resultado" class="ppt-resultado oculto">
        <p id="texto-vs" class="ppt-resultado__vs"></p>
        <p id="texto-resultado" class="ppt-resultado__veredicto"></p>
        <p id="texto-efecto" class="ppt-resultado__efecto"></p>
      </div>
    </div>
  </div>

  <script src="js/constantes.js"></script>
  <script src="js/mascota.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/gameLoop.js"></script>
  <script src="js/minijuego.js"></script>
  <script src="js/eventos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
