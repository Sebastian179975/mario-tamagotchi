<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <!-- cabeza -->
  <rect x="3" y="0" width="9" height="1" fill="#43a047"/>
  <rect x="2" y="1" width="11" height="5" fill="#43a047"/>
  <!-- nariz -->
  <rect x="10" y="3" width="3" height="2" fill="#ef9a9a"/>
  <!-- ojos: fondo blanco -->
  <rect x="4" y="1" width="3" height="3" fill="#ffffff"/>
  <rect x="8" y="1" width="3" height="3" fill="#ffffff"/>
  <!-- parpados caidos: cubre mitad superior del ojo -->
  <rect x="4" y="1" width="3" height="1" fill="#43a047"/>
  <rect x="8" y="1" width="3" height="1" fill="#43a047"/>
  <!-- pupilas bajas (mirada caida) -->
  <rect x="5" y="3" width="1" height="1" fill="#000"/>
  <rect x="9" y="3" width="1" height="1" fill="#000"/>
  <!-- cejas bajas (linea oscura encima de los ojos) -->
  <rect x="4" y="1" width="3" height="1" fill="#2e7d32"/>
  <rect x="8" y="1" width="3" height="1" fill="#2e7d32"/>
  <!-- boca triste -->
  <rect x="5" y="6" width="1" height="1" fill="#2e7d32"/>
  <rect x="6" y="5" width="2" height="1" fill="#2e7d32"/>
  <rect x="8" y="6" width="1" height="1" fill="#2e7d32"/>
  <!-- gota de sudor -->
  <rect x="1" y="1" width="1" height="1" fill="#5c94fc"/>
  <rect x="1" y="2" width="1" height="2" fill="#5c94fc"/>
  <rect x="2" y="3" width="1" height="1" fill="#5c94fc"/>
  <!-- cuerpo -->
  <rect x="3" y="7" width="9" height="4" fill="#43a047"/>
  <rect x="4" y="8" width="7" height="3" fill="#ffffff"/>
  <!-- caparazon -->
  <rect x="5" y="7" width="5" height="1" fill="#1b5e20"/>
  <!-- patas -->
  <rect x="2" y="11" width="4" height="2" fill="#43a047"/>
  <rect x="10" y="11" width="4" height="2" fill="#43a047"/>
  <!-- pies -->
  <rect x="1" y="13" width="5" height="2" fill="#e65c00"/>
  <rect x="10" y="13" width="5" height="2" fill="#e65c00"/>
</svg>
